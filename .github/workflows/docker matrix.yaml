name: Docker matrix
on: workflow_dispatch

jobs:
  test:
   runs-on: ${{matrix.os}}
   strategy:
     max-parallel: 1
     fail-fast: false
     matrix:
       os : [ubuntu-latest,windows-latest]
       images: [hello world, apline,sunildevops]
   steps:
     - name:  Docker details
       run: Docker info
       
     - name: Run image
       run: docker run ${{matrix.images}}
     
