name: validating without checkout
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

       - name: checkout the repo
         uses: actions/checkout@v7

       - name: Disaply the file content
         run: cat devops.txt

       - name: Permissions
         run: chmod +x uptime.sh

       - name: execute the shell script
         run: ./uptime.sh
